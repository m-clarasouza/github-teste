    <main>
    <form>
        <fieldset>
            <fieldset style="border: 2px solid black; width: 600px;">
        <legend>Formulário de contacto do Cesae</legend>

<label for="nome">Nome</label> 
<input type="text" id="nome" name="Nome" required placeholder="Insira o seu nome aqui">
<br><br>
<label for="email">Email</label>
<input type="email" required id="email" name="email">

<h3>Género:</h3>
<div>
    <input type="radio" id="Feminino" name="genero" value="Feminino">
    <label for="feminino">Feminino</label>
</div>

<div>
    <input type="radio" id="Masculino" name="genero" value="Masculino">
    <label for="masculino">Masculino</label>
</div>

<h3>Data atual:</h3>
<label for="data">Data</label>
<input type="date" id="data" name="data">

<h3>Turma:</h3>
<input type="text" list="loja" name="nome" id="nome" placeholder="Web Developer & Mobile">
<datalist id="loja">
    <option value="Web Developer & Mobile">Web Developer & Mobile</option>
<option value="Outros">Outros</option>
</datalist>
 
<h3>Mensagem:</h3>
<div>
    <textarea cols="30 rows=3">
    
    </textarea>
</div>
<br><br>

<input type="reset" value="Limpar" id="limpar" name="limpar">
<input type="submit" value="Enviar" id="enviar" name="enviar">
</fieldset>
</fieldset>
    </form>
